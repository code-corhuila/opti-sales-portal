server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP"}';
    }

    # remoteEntry.js decides which version of the portal the browser loads: it is never cached.
    location = /remotes/sales/remoteEntry.js {
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Everything else is fingerprinted by the build and can be cached for good.
    location /remotes/sales/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
}
