# The sales interface as a remote of the container. No published port: opti-front proxies /remotes/sales/.
name: opti-sales-portal

services:
  sales-portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: opti/sales-portal:local
    networks:
      - platform
    expose:
      - "80"
    restart: unless-stopped

networks:
  platform:
    external: true
